services:
  postgres:
    image: postgres:16-alpine
    container_name: emulation_tools_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASS:-postgres}
    ports:
      - ${DATABASE_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./bin/init-database.sh:/docker-entrypoint-initdb.d/init-database.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: emulation_tools_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - ${RABBITMQ_PORT:-5672}:5672
      - ${RABBITMQ_MANAGEMENT_PORT:-15672}:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: emulation_tools_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/emulation_tools}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-rpc://}
      UPLOAD_FOLDER: ${UPLOAD_FOLDER:-uploads/}
      DOWNLOAD_FOLDER: ${DOWNLOAD_FOLDER:-downloads/}
    volumes:
      - uploads_data:/api/uploads
      - downloads_data:/api/downloads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  celery_worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: emulation_tools_celery_worker
    restart: always
    command: celery -A app.utils.tasks worker --loglevel=info
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/emulation_tools}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-rpc://}
      UPLOAD_FOLDER: ${UPLOAD_FOLDER:-uploads/}
      DOWNLOAD_FOLDER: ${DOWNLOAD_FOLDER:-downloads/}
    volumes:
      - uploads_data:/api/uploads
      - downloads_data:/api/downloads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
  uploads_data:
  downloads_data:
